[project]
name = "hla-nomenclature"
version = "0.1.0"
description = "HLA-Bench-A: verifiable-reward HLA allele nomenclature resolution against a pinned IPD-IMGT/HLA release"
requires-python = ">=3.10"
dependencies = ["verifiers>=0.3", "datasets", "sci-envs @ git+https://github.com/jasonbrelsford/verifiable-science-envs.git"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["hla_nomenclature.py"]

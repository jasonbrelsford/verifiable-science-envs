# Deploy the HLA-Verify Hugging Face Space as a *static* Space (free tier: Hugging Face only
# hosts Gradio/Docker Spaces on free cpu-basic for PRO accounts). spaces/build_static.py assembles:
#   index.html    the interactive app; calls api.hlaverify.com from the visitor's browser
#   offline.html  the in-browser Pyodide checker, identical to hlaverify.com/demo
#   README.md     Space card + metadata (spaces/hla-verify/README.md)
# Runs on a hosted runner because huggingface.co is unreachable from the agent workspace.
# Trigger: push a change to .hf-space (the agent's token cannot dispatch workflows), or
# dispatch manually. Local equivalent: spaces/deploy.sh.
name: hf-space
on:
  push:
    branches: [main]
    paths: [".hf-space"]
  workflow_dispatch:
    inputs:
      space:
        description: "owner/space-name (owner must match the HF_TOKEN account)"
        default: "jason-brelsford/hla-verify"
      private:
        description: "create the Space private (true/false)"
        default: "false"
permissions: { contents: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Assemble the static Space
        run: python spaces/build_static.py
      - name: Push Space
        env:
          HF: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ inputs.space || 'jason-brelsford/hla-verify' }}
          PRIVATE: ${{ inputs.private || 'false' }}
        run: |
          set -e
          mkdir -p logs
          {
            NAME="${SPACE#*/}"
            echo "whoami: $(curl -s -H "Authorization: Bearer $HF" https://huggingface.co/api/whoami-v2 | head -c 200)"
            echo "create: $(curl -s -X POST https://huggingface.co/api/repos/create \
              -H "Authorization: Bearer $HF" -H "Content-Type: application/json" \
              -d "{\"type\":\"space\",\"name\":\"$NAME\",\"sdk\":\"static\",\"private\":$PRIVATE}" | head -c 300)"
            D=$(mktemp -d)
            git clone -q "https://user:$HF@huggingface.co/spaces/$SPACE" "$D"
            # Replace every file but .gitattributes with the new build.
            ( cd "$D" && git ls-files | grep -v '^\.gitattributes$' | while IFS= read -r f; do git rm -q -- "$f"; done )
            cp build/space/* "$D/"
            cd "$D"
            git add -- index.html offline.html README.md favicon.png
            git -c user.name=deploy -c user.email=deploy@hlaverify.com commit -qm "deploy HLA-Verify static app" || echo "no changes"
            git push -q
            echo "pushed to https://huggingface.co/spaces/$SPACE"
            sleep 30
            curl -s -H "Authorization: Bearer $HF" "https://huggingface.co/api/spaces/$SPACE/runtime" | head -c 300; echo
          } 2>&1 | sed "s/$HF/***HF***/g" | tee logs/hf-space.log
      - name: Commit log
        if: always()
        run: |
          git config user.name hf-deploy && git config user.email hf@users.noreply.github.com
          git add -f logs/hf-space.log
          git commit -m "hf-space: deploy log [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main

# Jobs for the self-hosted Windows runner "TOWER" (labels: self-hosted, Windows, X64).
# Manual only. Runs the benchmark with LOCAL models via Ollama (zero API cost) and,
# when `commit` is true, commits the summaries + results page back to main.
name: tower
on:
  workflow_dispatch:
    inputs:
      models:
        description: "space-separated model specs; ollama/<model> runs locally (e.g. ollama/qwen2.5:7b ollama/llama3.2:3b). Blank = baselines only."
        default: "ollama/qwen2.5:7b"
      split:
        description: "dev | test | all"
        default: "dev"
      commit:
        description: "commit results/ and bench page to main (true/false)"
        default: "true"
permissions:
  contents: write      # the job commits results back to main

jobs:
  bench:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run: { shell: powershell }   # Windows PowerShell 5.1 is always present; pwsh (7) is not
    env:
      PYTHONUTF8: "1"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install package
        run: python -m pip install --quiet -e ".[dev]"

      - name: Ollama — install if missing, start, pull models
        if: ${{ contains(inputs.models, 'ollama/') }}
        run: |
          $ErrorActionPreference = "Continue"
          if (-not (Get-Command ollama -ErrorAction SilentlyContinue)) {
            Write-Host "ollama not on PATH; trying winget (silent, user scope)"
            winget install --id Ollama.Ollama -e --silent --accept-package-agreements --accept-source-agreements --scope user
            $env:Path = [Environment]::GetEnvironmentVariable("Path","User") + ";" + [Environment]::GetEnvironmentVariable("Path","Machine") + ";$env:LOCALAPPDATA\Programs\Ollama"
          }
          if (-not (Get-Command ollama -ErrorAction SilentlyContinue)) { throw "Ollama is not installed on TOWER. Install from https://ollama.com/download and re-run." }
          ollama --version
          try { Invoke-WebRequest -UseBasicParsing http://localhost:11434/api/tags -TimeoutSec 3 | Out-Null; Write-Host "ollama already serving" }
          catch { Start-Process ollama -ArgumentList "serve" -WindowStyle Hidden; Start-Sleep 8 }
          $ErrorActionPreference = "Stop"
          foreach ($spec in "${{ inputs.models }}".Split(" ")) {
            if ($spec.StartsWith("ollama/")) { $m = $spec.Substring(7); Write-Host "pull $m"; ollama pull $m }
          }
          ollama list

      - name: Generate suite (sealed split stays on this machine)
        run: hla-bench generate

      - name: Cache raw responses between runs
        uses: actions/cache@v4
        with:
          path: runs/hla-bench-a/responses
          key: tower-responses-v0.1-${{ inputs.split }}-${{ github.run_id }}
          restore-keys: tower-responses-v0.1-${{ inputs.split }}-

      - name: Baselines
        run: hla-bench run oracle baseline-naive-string baseline-confident-guesser baseline-cautious-abstainer --split ${{ inputs.split }}

      - name: Models (log captured to runs/hla-bench-a/results/tower-log.txt)
        if: ${{ inputs.models != '' }}
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force runs/hla-bench-a/results | Out-Null
          $log = "runs/hla-bench-a/results/tower-log.txt"
          "== $(Get-Date -Format o) run ${{ github.run_id }} models=${{ inputs.models }} split=${{ inputs.split }}" | Out-File $log
          try { (Invoke-WebRequest -UseBasicParsing http://localhost:11434/api/tags -TimeoutSec 5).Content | Out-File -Append $log } catch { "ollama /api/tags unreachable: $_" | Out-File -Append $log }
          & hla-bench run ${{ inputs.models }} --split ${{ inputs.split }} 2>&1 | Tee-Object -FilePath $log -Append
          "exit=$LASTEXITCODE" | Out-File -Append $log
          exit $LASTEXITCODE

      - name: Report
        if: always()
        run: hla-bench report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tower-results-${{ github.run_id }}
          path: |
            runs/hla-bench-a/results/
            bench/HLA-Bench-A.md

      - name: Commit results
        if: ${{ always() && inputs.commit == 'true' }}
        run: |
          git config user.name "hla-bench bot"
          git config user.email "bot@users.noreply.github.com"
          git add runs/hla-bench-a/results bench/HLA-Bench-A.md
          git commit -m "bench(tower): ${{ inputs.models }} on ${{ inputs.split }} [skip ci]"
          if ($LASTEXITCODE -ne 0) { Write-Host "nothing to commit"; exit 0 }
          git pull --rebase origin main
          git push

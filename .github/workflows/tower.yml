# Jobs for the self-hosted Windows runner "TOWER" (labels: self-hosted, Windows, X64).
# Manual only. Uses TOWER's system Python, reuses the Ollama server already running on
# the box (or installs one), runs the requested local models against HLA-Bench-A or
# HLA-Bench-C at zero API cost, and commits results + the page.
#
# Runner facts this file is written around (2026-09-08):
#   * The runner service runs as NT AUTHORITY\NETWORK SERVICE — no admin, no per-user
#     PowerShell execution policy (so the default `powershell` shell refuses to run any
#     script), and actions/setup-python cannot install an interpreter for it. Every step
#     therefore runs under an explicit `-ExecutionPolicy Bypass` shell, and Python comes
#     from the machine-wide C:\Python314 through a venv kept in the runner tool cache.
#   * Ollama is installed per-user for the owner and serves on localhost:11434 whenever
#     the owner is logged in; the job talks to it over HTTP (the harness never shells
#     out to the ollama CLI) and only installs its own copy if nothing is serving.
name: tower
on:
  workflow_dispatch:
    inputs:
      models:
        description: "space-separated model specs (e.g. ollama/qwen2.5:7b ollama/llama3.2:3b); blank = baselines only"
        default: "ollama/qwen2.5:7b"
      split:
        description: "dev | test | all"
        default: "dev"
      commit:
        description: "commit results + page to main (true/false)"
        default: "true"
      family:
        description: "a = nomenclature (HLA-Bench-A), c = donor-recipient matching (HLA-Bench-C)"
        default: "a"
permissions:
  contents: write
jobs:
  run:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    defaults:
      run:
        # Windows PowerShell 5.1 is always present; pwsh (7) is not. Bypass is scoped to
        # this process only and is the sole way scripts run under the service account.
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      PYTHONUTF8: "1"
      OLLAMA_KEEP_ALIVE: "60m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      FAM: ${{ inputs.family || 'a' }}
      SYSTEM_PYTHON: 'C:\Python314\python.exe'
    steps:
      - uses: actions/checkout@v4
        with: { clean: false }        # keep runs/*/responses between runs so re-runs are free
      - name: Runner identity + persistent execution policy (idempotent)
        continue-on-error: true
        shell: cmd
        run: |
          whoami
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Bypass -Force; Get-ExecutionPolicy -List"
      - name: Keep TOWER awake (idempotent; owner-requested 2026-09)
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Start-Transcript -Path logs\keepawake.log -Force | Out-Null
          whoami
          # Never sleep or hibernate on AC power, so queued runs always find the machine.
          # (Needs admin; verified already applied on TOWER 2026-09-08 — AC standby = 0.)
          powercfg /change standby-timeout-ac 0
          powercfg /change hibernate-timeout-ac 0
          powercfg /change disk-timeout-ac 0
          try { powercfg /hibernate off } catch {}
          try {
            Get-NetAdapter -Physical | ForEach-Object {
              try { Set-NetAdapterPowerManagement -Name $_.Name -WakeOnMagicPacket Enabled -ErrorAction Stop
                    Write-Host "WoL enabled: $($_.Name)" } catch { Write-Host "WoL not settable: $($_.Name)" }
            }
          } catch { Write-Host "NIC power mgmt unavailable" }
          powercfg /query SCHEME_CURRENT SUB_SLEEP STANDBYIDLE | Select-String "Current AC"
          Stop-Transcript | Out-Null
      - name: Python (system interpreter, venv persisted in the runner tool cache)
        run: |
          $ErrorActionPreference = "Stop"
          $venv = Join-Path $env:RUNNER_TOOL_CACHE "tower-venv"
          $py = Join-Path $venv "Scripts\python.exe"
          if (-not (Test-Path $py)) {
            Write-Host "Creating venv at $venv from $env:SYSTEM_PYTHON"
            & $env:SYSTEM_PYTHON -m venv $venv
            if ($LASTEXITCODE -ne 0) { throw "venv creation failed" }
          }
          & $py --version
          & $py -m pip install --quiet --disable-pip-version-check -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { throw "pip install failed" }
          echo "$venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
          "VIRTUAL_ENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Ollama (reuse the running server; install only if nothing is serving)
        if: ${{ contains(inputs.models, 'ollama/') }}
        run: |
          $ErrorActionPreference = "Stop"
          $api = "http://localhost:11434"
          $serving = $false
          try { Invoke-RestMethod "$api/api/tags" | Out-Null; $serving = $true; Write-Host "Ollama already serving on $api" } catch {}
          if (-not $serving) {
            $local = Join-Path $env:LOCALAPPDATA "Programs\Ollama\ollama.exe"
            if (-not (Test-Path $local)) {
              Write-Host "Installing Ollama..."
              Invoke-WebRequest -Uri "https://ollama.com/download/OllamaSetup.exe" -OutFile "$env:TEMP\OllamaSetup.exe"
              Start-Process -FilePath "$env:TEMP\OllamaSetup.exe" -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait
            }
            Write-Host "Starting ollama serve..."
            Start-Process -FilePath $local -ArgumentList "serve" -WindowStyle Hidden
            for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; try { Invoke-RestMethod "$api/api/tags" | Out-Null; $serving = $true; break } catch {} }
            if (-not $serving) { throw "ollama did not start" }
          }
          # Pull over HTTP so no CLI is needed; a model already present returns immediately.
          foreach ($spec in "${{ inputs.models }}".Split(" ")) {
            if ($spec.StartsWith("ollama/")) {
              $m = $spec.Substring(7); Write-Host "pull $m"
              $r = Invoke-RestMethod -Method Post -Uri "$api/api/pull" -ContentType "application/json" -Body (@{ name = $m; stream = $false } | ConvertTo-Json) -TimeoutSec 3600
              Write-Host "  -> $($r.status)"
            }
          }
          (Invoke-RestMethod "$api/api/tags").models | ForEach-Object { Write-Host ("  {0}  {1:N1} GB" -f $_.name, ($_.size / 1GB)) }
      - name: Generate suite (sealed split stays on this machine)
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          cmd /c "hla-bench generate --family $env:FAM > logs\generate.log 2>&1"
          Get-Content logs\generate.log -Tail 40
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Commit failure log
        if: failure()
        run: |
          git config user.name "hla-bench tower"; git config user.email "tower@users.noreply.github.com"
          git fetch origin main; git stash -u -q 2>$null
          git checkout -q origin/main -- . 2>$null
          git add -f logs/generate.log logs/keepawake.log 2>$null
          git commit -m "tower: failure log [skip ci]" 2>$null
          git push origin HEAD:main 2>$null; exit 0
      - name: Baselines
        run: hla-bench run baseline-naive-string baseline-cautious-abstainer --suite "runs/hla-bench-$env:FAM" --split ${{ inputs.split }}
      - name: Models
        if: ${{ inputs.models != '' }}
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          cmd /c "hla-bench run ${{ inputs.models }} --suite runs/hla-bench-$env:FAM --split ${{ inputs.split }} > logs\tower-models.log 2>&1"
          Get-Content logs\tower-models.log -Tail 60
      - name: Report
        continue-on-error: true
        run: |
          $page = "bench/HLA-Bench-$($env:FAM.ToUpper()).md"
          hla-bench report --suite "runs/hla-bench-$env:FAM" --out $page
      - uses: actions/upload-artifact@v4
        with:
          name: tower-results
          path: |
            runs/hla-bench-*/results/
            bench/
      - name: Commit results
        if: ${{ inputs.commit == 'true' }}
        run: |
          $ErrorActionPreference = "Continue"
          git config user.name "hla-bench tower"
          git config user.email "tower@users.noreply.github.com"
          $suite = "runs/hla-bench-$env:FAM"
          $page = "bench/HLA-Bench-$($env:FAM.ToUpper()).md"
          # Re-apply our result files on top of whatever main is now, instead of rebasing a dirty tree.
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\keep" | Out-Null
          Copy-Item -Recurse -Force "$suite\results" "$env:RUNNER_TEMP\keep\results"
          Copy-Item -Force $page "$env:RUNNER_TEMP\keep\page.md"
          Copy-Item -Recurse -Force logs "$env:RUNNER_TEMP\keep\logs"
          git fetch origin main
          git reset --hard origin/main
          New-Item -ItemType Directory -Force -Path "$suite\results" | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\keep\results\*" "$suite\results\"
          Copy-Item -Force "$env:RUNNER_TEMP\keep\page.md" $page
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\keep\logs\*" logs\
          hla-bench report --suite $suite --out $page
          git add "$suite/results" bench
          git add -f logs
          git commit -m "bench(tower): ${{ inputs.models }} on ${{ inputs.split }} [family $env:FAM] [skip ci]"
          if ($LASTEXITCODE -ne 0) { Write-Host "nothing to commit"; exit 0 }
          git push origin HEAD:main
          exit $LASTEXITCODE

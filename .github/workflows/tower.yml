# Jobs for the self-hosted Windows runner "TOWER" (labels: self-hosted, Windows, X64).
# Manual only. Installs Ollama if missing, starts it, pulls the requested local models,
# runs them against HLA-Bench-A or HLA-Bench-C at zero API cost, and commits results + the page.
name: tower
on:
  workflow_dispatch:
    inputs:
      models:
        description: "space-separated model specs (e.g. ollama/qwen2.5:7b ollama/llama3.2:3b); blank = baselines only"
        default: "ollama/qwen2.5:7b"
      split:
        description: "dev | test | all"
        default: "dev"
      commit:
        description: "commit results + page to main (true/false)"
        default: "true"
      family:
        description: "a = nomenclature (HLA-Bench-A), c = donor-recipient matching (HLA-Bench-C)"
        default: "a"
permissions:
  contents: write
jobs:
  run:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 720
    defaults:
      run: { shell: powershell }   # Windows PowerShell 5.1 is always present; pwsh (7) is not
    env:
      PYTHONUTF8: "1"
      OLLAMA_KEEP_ALIVE: "60m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      FAM: ${{ inputs.family || 'a' }}
    steps:
      - uses: actions/checkout@v4
        with: { clean: false }        # keep runs/*/responses between runs so re-runs are free
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install package
        run: python -m pip install --quiet -e ".[dev]"
      - name: Ollama (install if missing, start, pull models)
        if: ${{ contains(inputs.models, 'ollama/') }}
        run: |
          $ErrorActionPreference = "Stop"
          $ollama = Get-Command ollama -ErrorAction SilentlyContinue
          if (-not $ollama) {
            $local = Join-Path $env:LOCALAPPDATA "Programs\Ollama\ollama.exe"
            if (-not (Test-Path $local)) {
              Write-Host "Installing Ollama..."
              Invoke-WebRequest -Uri "https://ollama.com/download/OllamaSetup.exe" -OutFile "$env:TEMP\OllamaSetup.exe"
              Start-Process -FilePath "$env:TEMP\OllamaSetup.exe" -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait
            }
            $env:PATH = "$(Split-Path $local);$env:PATH"
            echo "$(Split-Path $local)" | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          ollama --version
          try { Invoke-RestMethod http://localhost:11434/api/tags | Out-Null; Write-Host "Ollama already serving" }
          catch {
            Write-Host "Starting ollama serve..."
            Start-Process -FilePath "ollama" -ArgumentList "serve" -WindowStyle Hidden
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; try { Invoke-RestMethod http://localhost:11434/api/tags | Out-Null; $ok = $true; break } catch {} }
            if (-not $ok) { throw "ollama did not start" }
          }
          foreach ($spec in "${{ inputs.models }}".Split(" ")) {
            if ($spec.StartsWith("ollama/")) { $m = $spec.Substring(7); Write-Host "pull $m"; ollama pull $m }
          }
          ollama list
      - name: Generate suite (sealed split stays on this machine)
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          cmd /c "hla-bench generate --family $env:FAM > logs\generate.log 2>&1"
          Get-Content logs\generate.log -Tail 40
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Commit failure log
        if: failure()
        run: |
          git config user.name "hla-bench tower"; git config user.email "tower@users.noreply.github.com"
          git fetch origin main; git stash -u -q 2>$null
          git checkout -q origin/main -- . 2>$null
          git add -f logs/generate.log 2>$null
          git commit -m "tower: failure log [skip ci]" 2>$null
          git push origin HEAD:main 2>$null; exit 0
      - name: Baselines
        run: hla-bench run baseline-naive-string baseline-cautious-abstainer --suite "runs/hla-bench-$env:FAM" --split ${{ inputs.split }}
      - name: Models
        if: ${{ inputs.models != '' }}
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          cmd /c "hla-bench run ${{ inputs.models }} --suite runs/hla-bench-$env:FAM --split ${{ inputs.split }} > logs\tower-models.log 2>&1"
          Get-Content logs\tower-models.log -Tail 60
      - name: Report
        continue-on-error: true
        run: |
          $page = "bench/HLA-Bench-$($env:FAM.ToUpper()).md"
          hla-bench report --suite "runs/hla-bench-$env:FAM" --out $page
      - uses: actions/upload-artifact@v4
        with:
          name: tower-results
          path: |
            runs/hla-bench-*/results/
            bench/
      - name: Commit results
        if: ${{ inputs.commit == 'true' }}
        run: |
          $ErrorActionPreference = "Continue"
          git config user.name "hla-bench tower"
          git config user.email "tower@users.noreply.github.com"
          $suite = "runs/hla-bench-$env:FAM"
          $page = "bench/HLA-Bench-$($env:FAM.ToUpper()).md"
          # Re-apply our result files on top of whatever main is now, instead of rebasing a dirty tree.
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\keep" | Out-Null
          Copy-Item -Recurse -Force "$suite\results" "$env:RUNNER_TEMP\keep\results"
          Copy-Item -Force $page "$env:RUNNER_TEMP\keep\page.md"
          Copy-Item -Recurse -Force logs "$env:RUNNER_TEMP\keep\logs"
          git fetch origin main
          git reset --hard origin/main
          New-Item -ItemType Directory -Force -Path "$suite\results" | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\keep\results\*" "$suite\results\"
          Copy-Item -Force "$env:RUNNER_TEMP\keep\page.md" $page
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\keep\logs\*" logs\
          hla-bench report --suite $suite --out $page
          git add "$suite/results" bench
          git add -f logs
          git commit -m "bench(tower): ${{ inputs.models }} on ${{ inputs.split }} [family $env:FAM] [skip ci]"
          if ($LASTEXITCODE -ne 0) { Write-Host "nothing to commit"; exit 0 }
          git push origin HEAD:main
          exit $LASTEXITCODE

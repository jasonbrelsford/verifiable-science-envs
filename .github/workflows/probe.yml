# Read-only probe of the live API and site, for the scheduled HLA-Verify tasks. Their
# sandbox cannot reach api.hlaverify.com or hlaverify.com, but it can read job logs, so
# this runner does the fetching and prints what it saw as one JSON line inside a
# `::group::probe.json` log group (the site's unmet-report workflow uses the same shape),
# plus a Markdown table on the step summary. The job fails when a document is missing, a
# stated release disagrees with /healthz, or the 17-name allele panel, the release-history routes and the support report / fixed verify and
# normalize strings answer differently from the contract, so the run's conclusion is the
# signal. Anonymous calls only — no key, no secret, nothing written but one labelled probe report: 24 billable calls per
# run out of the runner IP's 100/day. Dispatch it, then read the log of the run it starts.
name: probe
on:
  schedule:
    # The evaluations read the newest probe run, and they fire around 01:00-03:00 and
    # 15:00-18:00 UTC. GitHub's cron queue runs late, by hours on a busy day (the
    # "05:40" run of 2026-11-02 started 13:46), so each evaluation window gets its own
    # early slot and the last probe is never a day old (#158). 3 scheduled runs
    # plus one per deploy, 24 billable calls each, from shared GitHub runner IPs.
    - cron: "17 0 * * *"
    - cron: "47 5 * * *"
    - cron: "17 14 * * *"
  # A deploy changes what the probe would say, so read it again right after one.
  workflow_run:
    workflows: [edge-deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
permissions: { contents: read }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Probe api.hlaverify.com and hlaverify.com
        run: python3 .github/workflows/probe.py --out probe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: probe.json
          retention-days: 30

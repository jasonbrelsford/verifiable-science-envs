# Deploy the HLA-Verify API Worker (edge/) to Cloudflare. Tables are regenerated from the
# pinned release on every deploy, so a release bump is: change HLA_VERIFY_TAG, push.
# Secrets: CF_WORKERS_TOKEN (Workers Scripts + Routes + Custom Domains edit on the account/zone).
name: edge-deploy
on:
  push:
    branches: [main]
    paths:
      - "edge/src/**"
      - "edge/wrangler.jsonc"
      - "sci_envs/service/edge_export.py"
      - ".github/workflows/edge-deploy.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/sci_envs/imgt
          key: imgt-v3.65.0-alpha
      - run: pip install -e ".[service]"
      - run: python -m sci_envs.service.edge_export
      - run: cd edge && node --test test/golden.test.mjs
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: cd edge && npx --yes wrangler@4 deploy
      - name: wait for the new build to be live
        # wrangler returns before the new version has reached every edge location, and
        # a smoke check that needs new code can race it (2026-10-15: the first pgx check
        # ran 1s after the deploy and got the previous build). The tables are regenerated
        # on every deploy, so their export time is the build marker: /healthz reports it,
        # and the smoke step starts only once it matches the manifest this run just built.
        run: |
          want=$(python3 -c 'import json; print(json.load(open("edge/public/manifest.json"))["exported_at"])')
          for i in $(seq 1 30); do
            got=$(curl -sf --max-time 10 https://api.hlaverify.com/healthz | python3 -c 'import json,sys; print(json.load(sys.stdin).get("exported_at", ""))' 2>/dev/null || true)
            if [ "$got" = "$want" ]; then echo "build $want is live after $((i * 5 - 5))s"; exit 0; fi
            sleep 5
          done
          echo "::error::the new build (exported_at $want) was not serving after 150s; /healthz last reported '$got'"
          exit 1
      - name: smoke
        # Every check names what it got on failure, as a check-run annotation: the job log
        # is not readable from the scheduled tasks' sandbox, the annotations are. The body
        # is matched in bash, not through a pipe: this shell runs with pipefail, and a
        # `curl | head`/`| grep -q` that stops reading early kills curl with EPIPE (exit 23)
        # on any body larger than the pipe buffer — the CSV table is — so a correct answer
        # failed the old form of this step too.
        run: |
          check() {  # check <name> <ERE the 200 body must match> <curl args...>
            local name=$1 re=$2; shift 2
            local out code body
            out=$(curl -s --max-time 20 -w '\n%{http_code}' "$@") || { echo "::error::smoke $name: curl failed (exit $?)"; exit 1; }
            code=${out##*$'\n'}; body=${out%$'\n'*}
            if [ "$code" != 200 ] || ! [[ $body =~ $re ]]; then
              echo "::error::smoke $name failed: HTTP $code, body: ${body:0:300}"
              exit 1
            fi
            echo "smoke $name ok"
          }
          check healthz '"ok": ?true' https://api.hlaverify.com/healthz
          check verify '"hallucinated":1' https://api.hlaverify.com/v1/verify -H 'content-type: application/json' -d '{"text":"A*0101 DQB1*05:03:26:99"}'
          # pharmacogenomics: the vendored bundle shipped and the normalize-then-join path works
          check pgx-table '^source,source_record_id,' 'https://api.hlaverify.com/v1/pgx/table?format=csv'
          check pgx-screen '"drugs_actionable":\["abacavir"\]' https://api.hlaverify.com/v1/pgx/screen -H 'content-type: application/json' -d '{"alleles":["B*5701"]}'
      - name: smoke mcp
        env:
          MCP: https://api.hlaverify.com/mcp
          META: '"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}'
        run: |
          # 2026-07-28 era: no handshake; MCP-Protocol-Version / Mcp-Method / Mcp-Name headers must mirror the body.
          curl -sSf "$MCP" -H 'content-type: application/json' -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: server/discover' \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{'"$META"'}}' | grep -q '"supportedVersions":\[[^]]*"2026-07-28"'
          curl -sSf "$MCP" -H 'content-type: application/json' -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' -H 'Mcp-Name: verify_text' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"verify_text","arguments":{"text":"A*0101 DQB1*05:03:26:99"},'"$META"'}}' | grep -q '"hallucinated":1'
          # Legacy era: initialize handshake.
          curl -sSf "$MCP" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":3,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"edge-deploy-smoke","version":"1"}}}' | grep -q '"protocolVersion":"2025-06-18"'

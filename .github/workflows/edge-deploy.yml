# Deploy the HLA-Verify API Worker (edge/) to Cloudflare. Tables are regenerated from the
# pinned release on every deploy, so a release bump is: change HLA_VERIFY_TAG, push.
# Secrets: CF_WORKERS_TOKEN (Workers Scripts + Routes + Custom Domains edit on the account/zone).
name: edge-deploy
on:
  push:
    branches: [main]
    paths:
      - "edge/src/**"
      - "edge/wrangler.jsonc"
      - "sci_envs/service/edge_export.py"
      - ".github/workflows/edge-deploy.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/sci_envs/imgt
          key: imgt-v3.65.0-alpha
      - run: pip install -e ".[service]"
      - run: python -m sci_envs.service.edge_export
      - run: cd edge && node --test test/golden.test.mjs
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: cd edge && npx --yes wrangler@4 deploy
      - name: smoke
        run: |
          curl -sf https://api.hlaverify.com/healthz
          curl -sf https://api.hlaverify.com/v1/verify -H 'content-type: application/json' -d '{"text":"A*0101 DQB1*05:03:26:99"}' | grep -q '"hallucinated":1'
      - name: smoke mcp
        env:
          MCP: https://api.hlaverify.com/mcp
          META: '"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{}}'
        run: |
          # 2026-07-28 era: no handshake; MCP-Protocol-Version / Mcp-Method / Mcp-Name headers must mirror the body.
          curl -sSf "$MCP" -H 'content-type: application/json' -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: server/discover' \
            -d '{"jsonrpc":"2.0","id":1,"method":"server/discover","params":{'"$META"'}}' | grep -q '"supportedVersions":\[[^]]*"2026-07-28"'
          curl -sSf "$MCP" -H 'content-type: application/json' -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' -H 'Mcp-Name: verify_text' \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"verify_text","arguments":{"text":"A*0101 DQB1*05:03:26:99"},'"$META"'}}' | grep -q '"hallucinated":1'
          # Legacy era: initialize handshake.
          curl -sSf "$MCP" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":3,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"edge-deploy-smoke","version":"1"}}}' | grep -q '"protocolVersion":"2025-06-18"'

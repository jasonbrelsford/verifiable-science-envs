# Configure the hlaverify.com zone via the Cloudflare API — DNS placeholders and
# email routing only. Runs on a hosted runner because both the agent workspace and
# the local VM sit behind an egress allowlist that blocks api.cloudflare.com.
# Idempotent — safe to re-run.
#
# What the SITE is served by is no longer decided here: jasonbrelsford/hlaverify-website
# owns the `hlaverify-landing` Worker and every page on hlaverify.com, including
# /product, /demo and /llms.txt. This workflow used to upload that Worker from
# assets/ and, when it could not, point a zone-wide redirect rule at GitHub — either
# would now overwrite or shadow that site, so both were removed. assets/ stays as the
# source these pages were migrated from; edits there no longer reach the web.
name: cloudflare
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure zone
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p logs
          python .github/workflows/cloudflare_setup.py 2>&1 | tee logs/cloudflare.log
      - name: Commit log (Actions logs are unreachable from the agent; the repo is the channel)
        if: always()
        run: |
          git config user.name cf-setup && git config user.email cf@users.noreply.github.com
          git add -f logs/cloudflare.log
          git commit -m "cloudflare: setup log [skip ci]" || exit 0
          git pull --rebase origin main && git push origin HEAD:main

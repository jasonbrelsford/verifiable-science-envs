name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/sci_envs/imgt
          key: imgt-v3.65.0-alpha
      - run: pip install -e ".[dev,service,mcp]"
      - run: pytest -q
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: "22" }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/sci_envs/imgt
          key: imgt-v3.65.0-alpha
      - run: pip install -e ".[service]"
      - name: Export edge tables from the pinned release
        run: python -m sci_envs.service.edge_export
      - name: Worker tests — golden equivalence with the Python oracle, MCP protocol, keys, billing
        run: cd edge && node --test

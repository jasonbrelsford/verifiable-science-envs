[project]
name = "sci-envs"
version = "0.1.0"
description = "Verifiable-reward environments and evals for clinical genomics / immunogenetics"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sci_envs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

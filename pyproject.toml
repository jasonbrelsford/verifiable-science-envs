[project]
name = "sci-envs"
version = "0.1.0"
description = "Verifiable-reward environments and evals for clinical genomics / immunogenetics"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
adapters = ["verifiers>=0.3", "datasets", "inspect-ai>=0.3"]
service = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
hla-bench = "sci_envs.harness.run:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sci_envs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
